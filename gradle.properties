org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.disallowKotlinSourceSets=false
# AGP 9.1 : garder le pipeline Kotlin/KSP/Hilt existant pour cette migration ciblée.
android.builtInKotlin=false
android.newDsl=false
# Les plateformes/outils présents sont utilisés sans installation SDK automatique.
android.builder.sdkDownload=false
